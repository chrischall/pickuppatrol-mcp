version: 1
name: PickUp Patrol
slug: pickuppatrol
summary: >-
  Read and change your children's school dismissal plans in PickUp Patrol —
  defaults, day-by-day changes and school cutoff times
env:
  - name: PICKUPPATROL_USERNAME
    required: false
    help: >-
      The email address you sign in to app.pickuppatrol.net with.
  - name: PICKUPPATROL_PASSWORD
    secret: true
    required: false
    help: >-
      Your PickUp Patrol password. Stored by the host, never logged by this
      server.
egress:
  allow:
    # Only hosts the SERVER process actually fetches. Hosts that appear
    # solely in a URL this server BUILDS and returns are excluded.
    - app.pickuppatrol.net
examples:
  - prompt: How are my kids getting home from school each day this week?
    note: Reads the weekly default dismissal plans for every student.
  - prompt: Are there any pickup changes scheduled for next week, and what's the cutoff for making one today?
    note: Lists day-by-day plans and the school's plan cutoff times.
  - prompt: Which school holidays or closures are coming up this month?
    note: Lists non-school days for the student's school.
